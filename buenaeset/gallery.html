<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buenaeset - Gallery</title>
    <link rel="stylesheet" href="/assets/css/buenaeset.css" />
  </head>
  <body>
    <header class="buena-top">
      <div class="buena-top-inner">
        <a class="buena-brand" href="/buenaeset/">Buenaeset</a>
        <nav class="buena-links" aria-label="Buenaeset navigation">
          <a class="buena-link" href="/buenaeset/">Front Page</a>
          <a class="buena-link" href="/buenaeset/info.html">Information</a>
          <a class="buena-link" href="/buenaeset/calendar.html">Calendar</a>
          <a class="buena-link active" href="/buenaeset/gallery.html">Gallery</a>
          <a class="buena-link" href="/buenaeset/projects.html">Projects</a>
        </nav>
      </div>
    </header>

    <section class="buena-hero" style="background-image: url('/assets/img/buenaeset/scene-8.svg'); min-height: 38vh;">
      <div class="buena-hero-inner">
        <h1>Photo Gallery</h1>
        <p>Visual overview of rooms, outdoor areas and surrounding nature.</p>
      </div>
    </section>

    <main class="buena-shell">
      <div class="gallery-grid">
        <figure><img src="/assets/img/buenaeset/scene-1.svg" alt="Exterior front" /><figcaption>Exterior front in morning light</figcaption></figure>
        <figure><img src="/assets/img/buenaeset/scene-2.svg" alt="Terrace" /><figcaption>South-facing terrace and grill zone</figcaption></figure>
        <figure><img src="/assets/img/buenaeset/scene-3.svg" alt="Lounge" /><figcaption>Main lounge and fireplace</figcaption></figure>
        <figure><img src="/assets/img/buenaeset/scene-4.svg" alt="Kitchen" /><figcaption>Open kitchen and family table</figcaption></figure>
        <figure><img src="/assets/img/buenaeset/scene-5.svg" alt="Garden" /><figcaption>Garden play area and outdoor shower</figcaption></figure>
        <figure><img src="/assets/img/buenaeset/scene-6.svg" alt="Bedroom" /><figcaption>Primary bedroom with sea breeze window</figcaption></figure>
        <figure><img src="/assets/img/buenaeset/scene-7.svg" alt="Bathroom" /><figcaption>Bathroom with walk-in shower</figcaption></figure>
        <figure><img src="/assets/img/buenaeset/scene-8.svg" alt="Shoreline" /><figcaption>Evening shoreline trail near the house</figcaption></figure>
        <figure><img src="/assets/img/buenaeset/scene-9.svg" alt="Dining" /><figcaption>Dining setup for eight guests</figcaption></figure>
        <figure><img src="/assets/img/buenaeset/scene-10.svg" alt="Neighborhood" /><figcaption>Neighborhood paths and local harbor</figcaption></figure>
      </div>
    </main>
