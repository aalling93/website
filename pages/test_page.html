<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway" />

  <style>
    :root {
      --accent: #0b5cff;
      --bg: linear-gradient(135deg, #0f172a, #1e293b);
      --card: #ffffff;
      --muted: #6b7280;
    }

    body {
      font-family: "Raleway", sans-serif;
      margin: 0;
      background: var(--bg);
      color: white;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px 60px;
      text-align: center;
    }

    h1 {
      font-weight: 600;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #cbd5e1;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--card);
      color: black;
      border-radius: 14px;
      padding: 30px 20px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 35px rgba(0,0,0,0.35);
      background: #f8fafc;
    }

    .card h2 {
      margin: 12px 0 6px;
      font-size: 22px;
    }

    .card p {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }

    .icon {
      font-size: 34px;
      color: var(--accent);
    }

    footer {
      margin-top: 60px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Access Portal</h1>
    <div class="subtitle">Select a service</div>

    <div class="grid">

      <div class="card" onclick="window.open('https://aalling93-my-site-app-kzwtkf.streamlit.app/','_blank')">
        <div class="icon"></div>
        <h2>CV</h2>
        <p>View profile and background</p>
      </div>

      <div class="card" onclick="alert('You do not have access to Git Server.')">
        <div class="icon"></div>
        <h2>Git Server</h2>
        <p>Internal repositories</p>
      </div>

      <div class="card" onclick="alert('You do not have access to Nextcloud.')">
        <div class="icon"></div>
        <h2>Nextcloud</h2>
        <p>File storage and collaboration</p>
      </div>

      <div class="card" onclick="alert('You do not have access to Private.')">
        <div class="icon"></div>
        <h2>Private</h2>
        <p>Restricted content</p>
      </div>

      <div class="card" onclick="window.location.href='http://kaaso-tuf-gaming-x870-plus-wifi-10de:5163'">
        <div class="icon"></div>
        <h2>Ship App</h2>
        <p>Open ship monitoring interface</p>
      </div>

    </div>

    <footer>Internal system portal</footer>
  </div>
</body>
</html>
